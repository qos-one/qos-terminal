name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check the server functions code — no system packages needed (fast and stable)
  server:
    runs-on: ubuntu-24.04          # image pinned: ubuntu-latest is moving to 26.04 (Oct 2026)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: cargo check (fullstack server functions)
        run: cargo check --locked --no-default-features --features server
      - name: cargo test (fullstack server functions)
        run: cargo test --locked --no-default-features --features server

  # Check the desktop app — needs WebKitGTK: .deb files are kept in the GitHub cache (later runs skip the Ubuntu mirror download)
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for Dioxus desktop (WebKitGTK, cached)
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          # List every -dev dependency explicitly (the cache stores only listed packages → otherwise the glib/cairo/pango … .pc files are missing)
          packages: >-
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libglib2.0-dev
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libatk1.0-dev libayatana-appindicator3-dev
            libxdo-dev librsvg2-dev libssl-dev pkg-config
          version: 2
      - name: Verify pkg-config (install missing packages if the cache was incomplete)
        timeout-minutes: 10
        run: |
          MODS="webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0 glib-2.0 cairo pango gdk-pixbuf-2.0"
          if ! pkg-config --exists $MODS; then
            echo "::warning::apt cache incomplete — installing from Ubuntu mirror"
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev libssl-dev pkg-config
          fi
          for m in $MODS; do echo "$m $(pkg-config --modversion $m)"; done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: cargo check (desktop client)
        run: cargo check --locked
