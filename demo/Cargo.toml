[package]
name = "qos-demo"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "QOS Terminal web demo — the Terminal UI compiled for the browser, talking to a simulated backend"

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["demo"]
demo = []
# never enabled here; declared so the shared sources (../src) compile without cfg warnings
desktop = []
mobile = []
server = []
web = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
